<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Browser journey harness</title>
    <style>
      html,
      body,
      iframe {
        border: 0;
        box-sizing: border-box;
        height: 100%;
        margin: 0;
        width: 100%;
      }

      output {
        left: 0;
        position: fixed;
        top: 0;
      }
    </style>
  </head>
  <body>
    <iframe title="Superfície sob teste"></iframe>
    <output data-browser-journey>executando</output>
    <script>
      const output = document.querySelector('[data-browser-journey]');
      let frame = document.querySelector('iframe');
      const parameters = new URL(location.href).searchParams;
      const journey = parameters.get('journey') || 'layout';
      const target = parameters.get('target') || '/';

      function waitFor(predicate, timeout = 7000, label = journey) {
        const startedAt = performance.now();
        return new Promise((resolve, reject) => {
          const inspect = () => {
            let value = null;
            try {
              value = predicate();
            } catch {
              value = null;
            }
            if (value) {
              resolve(value);
              return;
            }
            if (performance.now() - startedAt > timeout) {
              reject(new Error(`timeout:${label}`));
              return;
            }
            setTimeout(inspect, 40);
          };
          inspect();
        });
      }

      function load(path) {
        const expected = new URL(path, location.origin);
        const nextFrame = frame.cloneNode(false);
        nextFrame.removeAttribute('src');
        frame.replaceWith(nextFrame);
        frame = nextFrame;
        frame.src = expected.href;
        return waitFor(
          () => {
            const view = frame.contentWindow;
            const current = new URL(view.location.href);
            return (
              current.pathname === expected.pathname
              && [...expected.searchParams].every(
                ([name, value]) => current.searchParams.get(name) === value,
              )
              && view.document.documentElement
            )
              ? view
              : null;
          },
          7000,
          `navigation:${path}`,
        );
      }

      function changeValue(field, value) {
        field.value = value;
        field.dispatchEvent(new Event('input', { bubbles: true }));
        field.dispatchEvent(new Event('change', { bubbles: true }));
      }

      function markProgress(value) {
        output.dataset.progress = value;
      }

      function surfaceIsReady(view, path) {
        const document = view.document;
        const pathname = new URL(path, location.origin).pathname;

        if (pathname === '/') {
          return Boolean(
            document.querySelector('[data-theory-grid] .theory-card')
            && document.querySelector('[data-notable-figures-preview] .notable-preview-card')
            && document.querySelector('[data-learning-paths-preview] .route-preview-card'),
          );
        }

        if (pathname === '/Teorias/teorias.html') {
          return Boolean(
            document.querySelector('[data-theory-card]')
            && document.querySelector('[data-theory-dossier] > *'),
          );
        }

        if (pathname === '/GrandesNomes/grandes-nomes.html') {
          const carousel = document.querySelector('[data-notable-carousel]');
          return Boolean(
            carousel?.swiper?.slides?.length > 2
            && carousel.querySelector('[data-figure-select][aria-current="true"]')
            && document.querySelector('[data-notable-detail] .figure-dossier'),
          );
        }

        if (pathname === '/Constelacoes/constelacoes.html') {
          return Boolean(
            document.querySelectorAll('[data-constellation-option]').length > 2
            && document.querySelector('[data-atlas-chart] svg')
            && document.querySelector('[data-atlas-detail] > *'),
          );
        }

        if (pathname === '/Laboratorio/experimento.html') {
          const simulation = document.querySelector('[data-simulation-root]');
          return Boolean(
            simulation?.getAttribute('aria-busy') === 'false'
            && simulation.querySelector('.simulation-layout'),
          );
        }

        if (pathname === '/Contribuicoes/contribuicoes.html') {
          return Boolean(
            document.querySelector('[data-contribution-types] article')
            && document.querySelector('[data-contribution-form]')
            && document.querySelector('[data-contribution-type-select] option'),
          );
        }

        if (pathname.startsWith('/Arquivo/publicacoes/')) {
          const documentElement = document.querySelector('[data-publication-document]');
          return Boolean(
            documentElement
            && !documentElement.hidden
            && document.querySelector('[data-publication-title]')?.textContent.trim()
            && document.querySelector('[data-publication-references] a')
            && document.querySelector('[data-publication-transparency] a'),
          );
        }

        return Boolean(document.querySelector('main'));
      }

      function waitForLayoutFrames(view) {
        return new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            resolve();
          };
          view.setTimeout(finish, 120);
          view.requestAnimationFrame(() => view.requestAnimationFrame(finish));
        });
      }

      async function loadReady(path) {
        const view = await load(path);
        await waitFor(
          () => (
            view.document.readyState !== 'loading'
            && surfaceIsReady(view, path)
          ),
          7000,
          `ready:${path}`,
        );
        await waitForLayoutFrames(view);
        return view;
      }

      function measureLayout(view, {
        height,
        path,
        width,
      }) {
        const documentElement = view.document.documentElement;
        return {
          h1Count: view.document.querySelectorAll('main h1').length,
          height,
          missingImageAlt: [...view.document.images]
            .filter((image) => !image.hasAttribute('alt')).length,
          overflow: documentElement.scrollWidth > documentElement.clientWidth + 1,
          path,
          skipLink: Boolean(view.document.querySelector('.skip-link[href^="#"]')),
          viewportWidth: view.innerWidth,
          width,
        };
      }

      async function resizeSurface(view, width, height, label) {
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        await waitFor(
          () => view.innerWidth === width,
          2000,
          `resize:${label}:${width}`,
        );
        await waitForLayoutFrames(view);
      }

      async function layout() {
        const view = await loadReady(target);
        const measurement = measureLayout(view, {
          height: view.innerHeight,
          path: target,
          width: view.innerWidth,
        });
        return {
          ...measurement,
          reducedMotion: view.matchMedia('(prefers-reduced-motion: reduce)').matches,
        };
      }

      async function reflow320() {
        frame.style.width = '320px';
        const view = await loadReady(target);
        const documentElement = view.document.documentElement;
        return {
          h1Visible: Boolean(
            view.document.querySelector('main h1')?.getBoundingClientRect().height,
          ),
          overflow: documentElement.scrollWidth > documentElement.clientWidth + 1,
          viewportWidth: view.innerWidth,
        };
      }

      async function layoutMatrix() {
        const homeViewportSizes = [
          [1440, 900],
          [1024, 768],
          [768, 900],
          [430, 900],
          [390, 844],
          [360, 800],
        ];
        const reflowTargets = [
          '/',
          '/Teorias/teorias.html',
          '/Mapa/mapa.html',
          '/GrandesNomes/grandes-nomes.html',
          '/Constelacoes/constelacoes.html',
          '/Arquivo/arquivo.html',
          '/Arquivo/publicacao.html',
          '/Laboratorio/laboratorio.html',
          '/Laboratorio/experimento.html?experimento=cone-de-luz',
          '/Rotas/rotas.html',
          '/Contribuicoes/contribuicoes.html',
        ];
        const layouts = [];
        const reflows = [];
        let homeView = null;

        for (const [width, height] of homeViewportSizes) {
          markProgress(`layout:home:${width}:start`);
          frame.style.width = `${width}px`;
          frame.style.height = `${height}px`;
          if (!homeView) homeView = await loadReady('/');
          else await resizeSurface(homeView, width, height, 'home');
          layouts.push(measureLayout(homeView, {
            height,
            path: '/',
            width,
          }));
          markProgress(`layout:home:${width}:complete`);
        }

        frame.style.height = '900px';
        frame.style.width = '320px';
        for (const path of reflowTargets) {
          markProgress(`reflow:${path}:start`);
          const view = path === '/'
            ? homeView
            : await loadReady(path);
          await resizeSurface(view, 320, 900, path);
          const documentElement = view.document.documentElement;
          reflows.push({
            h1Visible: Boolean(
              view.document.querySelector('main h1')?.getBoundingClientRect().height,
            ),
            overflow: documentElement.scrollWidth > documentElement.clientWidth + 1,
            path,
            viewportWidth: view.innerWidth,
          });
          markProgress(`reflow:${path}:complete`);
        }

        return { layouts, reflows };
      }

      async function responsiveSurfaceMatrix() {
        const viewportSizes = [
          [1440, 900],
          [768, 900],
          [390, 844],
        ];
        const paths = [
          '/Teorias/teorias.html',
          '/GrandesNomes/grandes-nomes.html#galeria',
          '/Constelacoes/constelacoes.html',
          '/Laboratorio/experimento.html?experimento=cone-de-luz',
          '/Contribuicoes/contribuicoes.html',
        ];
        const layouts = [];

        for (const path of paths) {
          let view = null;
          for (const [width, height] of viewportSizes) {
            markProgress(`responsive:${path}:${width}:start`);
            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            if (!view) view = await loadReady(path);
            else await resizeSurface(view, width, height, path);
            layouts.push(measureLayout(view, {
              height,
              path,
              width,
            }));
            markProgress(`responsive:${path}:${width}:complete`);
          }
        }

        return { layouts };
      }

      async function mobileNavigation() {
        const view = await loadReady(target);
        const toggle = await waitFor(() => view.document.querySelector('[data-menu-toggle]'));
        const navigation = view.document.querySelector('[data-primary-nav]');
        toggle.click();
        await waitFor(() => toggle.getAttribute('aria-expanded') === 'true');
        const opened = !navigation.inert && navigation.getAttribute('aria-hidden') !== 'true';
        view.document.dispatchEvent(new view.KeyboardEvent('keydown', {
          bubbles: true,
          key: 'Escape',
        }));
        await waitFor(() => toggle.getAttribute('aria-expanded') === 'false');
        return {
          closed: navigation.inert && navigation.getAttribute('aria-hidden') === 'true',
          focusReturned: view.document.activeElement === toggle,
          opened,
        };
      }

      async function globalSearch() {
        const view = await loadReady(target);
        const trigger = await waitFor(() => view.document.querySelector('.global-search-trigger'));
        trigger.focus();
        trigger.click();
        const input = await waitFor(() => {
          const candidate = view.document.querySelector('#global-search-input');
          return candidate && candidate.closest('dialog')?.open ? candidate : null;
        });
        changeValue(input, 'cone de luz');
        const result = await waitFor(() => view.document.querySelector('[data-search-result]'));
        const resultHref = result.getAttribute('href');
        view.document.querySelector('.global-search-close').click();
        await waitFor(() => !view.document.querySelector('.global-search-dialog')?.open);
        return {
          focusReturned: view.document.activeElement === trigger,
          resultHref,
          resultText: result.textContent,
        };
      }

      async function contributionPreview() {
        const view = await loadReady(target);
        const form = await waitFor(() => view.document.querySelector('[data-contribution-form]'));
        changeValue(form.elements.name, 'Pessoa de teste');
        changeValue(form.elements.email, 'teste@example.com');
        changeValue(form.elements.credit, 'Crédito público de teste');
        changeValue(form.elements.type, form.elements.type.options[1].value);
        changeValue(form.elements.title, 'Proposta verificável de teste');
        changeValue(
          form.elements.summary,
          'Resumo de teste suficientemente longo para validar a prévia editorial sem publicar ou enviar qualquer dado para um servidor externo.',
        );
        changeValue(
          form.elements.sources,
          'https://example.com/fonte-publica',
        );
        form.elements.rights.checked = true;
        form.elements.privacy.checked = true;
        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        const preview = await waitFor(() => {
          const candidate = view.document.querySelector('[data-contribution-preview][data-ready="true"]');
          return candidate && !candidate.hidden ? candidate : null;
        });
        view.document.querySelector('[data-contribution-save-draft]').click();
        const draft = Object.values(view.localStorage)
          .map((value) => String(value))
          .find((value) => value.includes('Pessoa de teste')) || '';
        return {
          focusMoved: view.document.activeElement === view.document.querySelector('[data-contribution-preview-heading]'),
          previewContainsTitle: preview.textContent.includes('Proposta verificável de teste'),
          rightsPersisted: /"rights"|"privacy"/.test(draft),
          status: view.document.querySelector('[data-contribution-status]').textContent,
        };
      }

      async function routeContinuity() {
        const view = await loadReady(target);
        const link = await waitFor(() => {
          const candidate = view.document.querySelector('[data-route-step-link]');
          return candidate?.href?.includes('origem=rotas') ? candidate : null;
        });
        const destination = link.href;
        const nextView = await load(destination);
        const bar = await waitFor(() => nextView.document.querySelector('[data-route-continuity]'));
        const routeId = bar.dataset.routeId;
        const step = bar.dataset.routeStep;
        const focusTarget = nextView.document.querySelector('main h1, main');
        bar.querySelector('.route-continuity-close').click();
        await waitFor(() => !bar.isConnected);
        return {
          closeFocusReturned: nextView.document.activeElement === focusTarget,
          nextLink: Boolean(bar.querySelector('.route-continuity-next')),
          resumeLink: Boolean(bar.querySelector('.route-continuity-resume')),
          routeId,
          step,
        };
      }

      async function constellationPreview() {
        const view = await loadReady(target);
        const options = await waitFor(() => {
          const candidates = view.document.querySelectorAll('[data-constellation-option]');
          return candidates.length > 2 ? candidates : null;
        });
        const stage = view.document.querySelector('[data-atlas-stage]');
        options[1].click();
        options[2].dispatchEvent(new view.PointerEvent('pointerover', {
          bubbles: true,
          pointerType: 'mouse',
        }));
        await waitFor(() => stage.dataset.preview === 'true');
        const previewed = stage.dataset.preview === 'true'
          && stage.querySelectorAll('.constellation-chart-lines line').length > 0;
        options[2].dispatchEvent(new view.PointerEvent('pointerout', {
          bubbles: true,
          pointerType: 'mouse',
        }));
        await waitFor(() => stage.dataset.preview === 'false');
        return {
          previewCleared: stage.dataset.preview === 'false',
          previewed,
          selectedChanged: options[1].getAttribute('aria-pressed') === 'true',
        };
      }

      async function desktopGallery() {
        const view = await loadReady(target);
        const carousel = await waitFor(() => {
          const candidate = view.document.querySelector('[data-notable-carousel]');
          const active = candidate?.querySelector(
            '[data-figure-select][aria-current="true"]',
          );
          return candidate?.swiper?.slides?.length > 2 && active ? candidate : null;
        });
        const instance = carousel.swiper;
        const finePointer = view.matchMedia('(any-pointer: fine)').matches;
        const coarsePointer = view.matchMedia('(any-pointer: coarse)').matches;
        const mouseProfile = finePointer || !coarsePointer;
        const activeFigure = () => carousel.querySelector(
          '[data-figure-select][aria-current="true"]',
        )?.dataset.figureSelect || '';
        const beforeFigure = activeFigure();
        const bounds = carousel.getBoundingClientRect();
        const start = {
          x: bounds.left + (bounds.width * 0.72),
          y: bounds.top + (bounds.height * 0.5),
        };
        const endX = bounds.left + (bounds.width * 0.18);
        const wrapper = carousel.querySelector('.swiper-wrapper');
        const pointerOptions = {
          bubbles: true,
          cancelable: true,
          isPrimary: true,
          pointerId: 41,
          pointerType: 'mouse',
        };
        const pointerDown = new view.PointerEvent('pointerdown', {
          ...pointerOptions,
          button: 0,
          buttons: 1,
          clientX: start.x,
          clientY: start.y,
        });
        wrapper.dispatchEvent(pointerDown);
        const dragStateStarted = carousel.classList.contains('is-dragging');
        for (let step = 1; step <= 5; step += 1) {
          view.document.dispatchEvent(new view.PointerEvent('pointermove', {
            ...pointerOptions,
            button: -1,
            buttons: 1,
            clientX: start.x + ((endX - start.x) * (step / 5)),
            clientY: start.y,
          }));
        }
        view.document.dispatchEvent(new view.PointerEvent('pointerup', {
          ...pointerOptions,
          button: 0,
          buttons: 0,
          clientX: endX,
          clientY: start.y,
        }));
        const dragStateCleared = !carousel.classList.contains('is-dragging');
        const afterFigure = await waitFor(() => {
          const candidate = activeFigure();
          return candidate && candidate !== beforeFigure ? candidate : null;
        });
        return {
          changed: beforeFigure !== afterFigure,
          dragStateCleared,
          dragStateStarted,
          domPointerSequence: true,
          interactionEnabled: [
            'followFinger',
            'grabCursor',
            'longSwipes',
            'shortSwipes',
            'simulateTouch',
          ].every((name) => instance.params[name] === true),
          mouseProfile,
          profileConsistent: mouseProfile
            ? (
              instance.params.longSwipesMs === 180
              && instance.params.longSwipesRatio === 0.16
              && instance.params.resistanceRatio === 0.86
              && instance.params.threshold === 2
              && instance.params.touchRatio === 1.12
            )
            : (
              instance.params.longSwipesMs === 300
              && instance.params.longSwipesRatio === 0.5
              && instance.params.resistanceRatio === 0.72
              && instance.params.threshold === 5
              && instance.params.touchRatio === 1
            ),
          trustedPointerInput: pointerDown.isTrusted,
        };
      }

      async function reducedMotionGallery() {
        const view = await loadReady(target);
        const carousel = view.document.querySelector('[data-notable-carousel]');
        const instance = carousel.swiper;
        const shell = view.document.querySelector('[data-notable-carousel-shell]');
        const control = view.document.querySelector('[data-notable-autoplay]');
        const label = view.document.querySelector('[data-notable-autoplay-label]');
        const progress = view.document.querySelector('.notable-autoplay-track span');
        await waitFor(() => (
          control.disabled
          && shell.classList.contains('is-autoplay-unavailable')
          && !shell.classList.contains('is-autoplay-running')
        ));
        const beforeFigure = carousel.querySelector(
          '[data-figure-select][aria-current="true"]',
        )?.dataset.figureSelect;
        await new Promise((resolve) => view.setTimeout(resolve, 700));
        const afterFigure = carousel.querySelector(
          '[data-figure-select][aria-current="true"]',
        )?.dataset.figureSelect;
        return {
          activeProfileStable: beforeFigure === afterFigure,
          autoplayControlDisabled: control.disabled,
          autoplayRunning: Boolean(instance.autoplay?.running),
          effect: instance.params.effect,
          progressAnimationName: view.getComputedStyle(progress).animationName,
          reducedMotion: view.matchMedia('(prefers-reduced-motion: reduce)').matches,
          speed: instance.params.speed,
          statusLabel: label.textContent.trim(),
          unavailable: shell.classList.contains('is-autoplay-unavailable'),
        };
      }

      async function publicationE2e() {
        const view = await loadReady(target);
        const document = view.document;
        const revisionId = view.location.hash.slice(1);
        const source = document.querySelector('[data-publication-references] a');
        const license = document.querySelector('[data-publication-transparency] a');
        const notice = document.querySelector('[data-publication-notice]');
        const relation = document.querySelector('[data-publication-relations] a');
        const canonical = document.querySelector('link[rel="canonical"]');
        const title = document.querySelector('[data-publication-title]');
        const article = document.querySelector('[data-publication-document]');
        const revision = revisionId ? document.getElementById(revisionId) : null;
        const relationHref = relation?.getAttribute('href') || '';
        if (!relationHref) throw new Error('publication-relation-missing');
        const relatedView = await loadReady(relationHref);
        const relatedUrl = new URL(relatedView.location.href);
        const activeTheory = relatedView.document.querySelector(
          `[data-theory-card="${CSS.escape(relatedUrl.searchParams.get('teoria') || '')}"]`,
        );

        return {
          articleVisible: Boolean(article && !article.hidden),
          canonicalPath: new URL(canonical.href).pathname,
          deepFragmentResolved: Boolean(revision),
          exceptionalNoticeVisible: Boolean(notice && !notice.hidden),
          licenseHref: license?.href || '',
          relatedTheoryActive: Boolean(activeTheory?.classList.contains('is-active')),
          relatedTheorySlug: relatedUrl.searchParams.get('teoria'),
          relationHref,
          sourceHref: source?.href || '',
          title: title?.textContent.trim() || '',
        };
      }

      const journeys = {
        'constellation-preview': constellationPreview,
        contribution: contributionPreview,
        'desktop-gallery': desktopGallery,
        layout,
        'layout-matrix': layoutMatrix,
        'mobile-navigation': mobileNavigation,
        'publication-e2e': publicationE2e,
        'reduced-motion-gallery': reducedMotionGallery,
        'reflow-320': reflow320,
        'responsive-surface-matrix': responsiveSurfaceMatrix,
        route: routeContinuity,
        search: globalSearch,
      };

      Promise.resolve()
        .then(() => journeys[journey]())
        .then((result) => {
          output.dataset.state = 'complete';
          output.textContent = JSON.stringify({ journey, ok: true, result });
        })
        .catch((error) => {
          output.dataset.state = 'failed';
          output.textContent = JSON.stringify({
            journey,
            message: error.message,
            ok: false,
          });
        });
    </script>
  </body>
</html>
